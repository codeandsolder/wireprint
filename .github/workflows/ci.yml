name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_WARNINGS: deny

jobs:
  rust-current-linux:
    name: Native nightly Linux checks and tests
    permissions:
      contents: read
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@343303848026ed142e48a6a82e7a889080b99b26 # main
    with:
      runner: ubuntu-26.04
      rust-components: "clippy rustfmt"
      rustflags: "-C target-cpu=x86-64-v2"
      strict-suites: |
        [{"name":"all-features","cargo":["--locked","--workspace","--all-targets","--all-features"],"allow-test-panics":true}]
      command: |
        # Require the wrapper family to resolve to one immutable fork source.
        cargo metadata --locked --format-version 1 | jq -e '
          [.packages[] | select(.name == "btls" or .name == "btls-sys" or .name == "tokio-btls")] as $tls
          | ($tls | length == 3)
            and ($tls | map(.name) | unique | length == 3)
            and ($tls | map(.source) | unique | length == 1)
            and all($tls[]; .source | startswith("git+https://github.com/codeandsolder/btls-fast.git?rev="))
            and ([.packages[] | select(.name == "boring-sys")] | length == 0)
            and (.packages as $packages | all(["wreq", "wreq-util", "http2", "netty"][]; . as $name | ([$packages[] | select(.name == $name)] | length == 1)))
            and ([.packages[] | select(.name == "http2" or .name == "netty") | .source] | unique | length == 1)

        ' >/dev/null
        # Embedded diagnostics must not compile comparative TLS backends or active QUIC probes.
        cargo metadata --locked --no-default-features --format-version 1 | jq -e '
          all(.packages[]; (.name | test("^(rustls|hyper-rustls|openssl|openssl-sys|native-tls|aws-lc-rs|aws-lc-sys|quiche)$")) | not)
        ' >/dev/null
        cargo test --locked -p wireprint --no-default-features --lib --tests
        CARGO_BUILD_WARNINGS=deny cargo check --locked --workspace --all-targets --all-features
        cargo test --locked --workspace --all-features
        RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --all-features --no-deps

  merge-gate:
    name: CI merge gate
    if: ${{ always() }}
    needs: [rust-current-linux]
    uses: codeandsolder/ci-workflows/.github/workflows/merge-gate.yml@343303848026ed142e48a6a82e7a889080b99b26 # main
    with:
      needs-json: ${{ toJSON(needs) }}
      expected-results: |
        [["rust-current-linux","success"]]
