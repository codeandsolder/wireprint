name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_WARNINGS: deny

jobs:
  strict-rust:
    name: Strict Rust
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@7d0552029497cf094787c3593f804d5bce137c4b # main
    with:
      cargo-args: "--locked --workspace --all-targets --all-features"
      allow-test-panics: true

  rust-current-linux:
    name: Native nightly Linux checks and tests
    permissions:
      contents: read
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@a5eb5179a21839ed047f10897a01ce3c7ec178b4 # main
    with:
      runner: ubuntu-26.04
      rust-components: "clippy rustfmt"
      rustflags: "-C target-cpu=x86-64-v2"
      command: |
        # Require the wrapper family to resolve to one immutable fork source.
        cargo metadata --locked --format-version 1 | jq -e '
          [.packages[] | select(.name == "btls" or .name == "btls-sys" or .name == "tokio-btls")] as $tls
          | ($tls | length == 3)
            and ($tls | map(.name) | unique | length == 3)
            and ($tls | map(.source) | unique | length == 1)
            and all($tls[]; .source | startswith("git+https://github.com/codeandsolder/btls-fast.git?rev="))
            and ([.packages[] | select(.name == "boring-sys")] | length == 0)
        ' >/dev/null
        cargo fmt --all -- --check
        CARGO_BUILD_WARNINGS=deny cargo check --locked --workspace --all-targets --all-features
        CARGO_BUILD_WARNINGS=deny cargo clippy --locked --workspace --all-features -- -D warnings
        cargo test --locked --workspace --all-features
        RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --all-features --no-deps
