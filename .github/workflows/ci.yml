name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_WARNINGS: deny

jobs:
  strict-rust:
    name: Strict Rust
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@f01e6b6b93a444e11600b90b5ca5ff42ec4206ee # main
    with:
      cargo-args: "--locked --workspace --all-targets --all-features"
      allow-test-panics: true
      checkout-submodules: "true"

  rust-current-linux:
    name: Rust 1.100.0 Linux checks and tests
    permissions:
      contents: read
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@ecf97ef6708aaba39d6afad83bb82ebcca84723a # main
    with:
      runner: ubuntu-26.04
      rust-toolchain: "1.100.0"
      rust-components: "clippy rustfmt"
      rustflags: "-C target-cpu=x86-64-v2"
      command: |
        git submodule update --init vendor/btls-sys/deps/boringssl
        # A source-only btls update must not silently pair a new wrapper with
        # this frozen native binding crate. Remove or refresh the patch first.
        cargo +1.100.0 metadata --locked --format-version 1 | jq -e '
          [.packages[] | select(.name == "btls-sys")] as $sys
          | ($sys | length == 1)
            and ($sys[0].source == null)
            and ($sys[0].manifest_path | endswith("/vendor/btls-sys/Cargo.toml"))
            and all(.packages[] | select(.name == "btls" or .name == "tokio-btls");
              .source | endswith("#3c1dd080ba617d78c63cd09285d2ce31abcdcbf9"))
        ' >/dev/null
        cargo +1.100.0 fmt --all -- --check
        CARGO_BUILD_WARNINGS=deny cargo +1.100.0 check --locked --workspace --all-targets --all-features
        CARGO_BUILD_WARNINGS=deny cargo +1.100.0 clippy --locked --workspace --all-features -- -D warnings
        cargo +1.100.0 test --locked --workspace --all-features
        RUSTDOCFLAGS='-D warnings' cargo +1.100.0 doc --locked --workspace --all-features --no-deps
