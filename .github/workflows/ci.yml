name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_WARNINGS: deny

jobs:
  strict-rust:
    name: Strict Rust
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@c56a893aacd6338669d625f16f235a8cb24a4bad # main
    with:
      cargo-args: "--locked --workspace --all-targets --all-features"
      allow-test-panics: true

  rust-current-linux:
    name: Rust 1.100.0 Linux checks and tests
    permissions:
      contents: read
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@47aa3c1b587f9933f56310f82427ff86539b3ac9 # main
    with:
      runner: ubuntu-26.04
      rust-toolchain: "1.100.0"
      rust-components: "clippy rustfmt"
      rustflags: "-C target-cpu=x86-64-v2"
      command: |
        cargo +1.100.0 metadata --locked --format-version 1 >/dev/null
        cargo +1.100.0 fmt --all -- --check
        CARGO_BUILD_WARNINGS=deny cargo +1.100.0 check --locked --workspace --all-targets --all-features
        CARGO_BUILD_WARNINGS=deny cargo +1.100.0 clippy --locked --workspace --all-features -- -D warnings
        cargo +1.100.0 test --locked --workspace --all-features
        RUSTDOCFLAGS='-D warnings' cargo +1.100.0 doc --locked --workspace --all-features --no-deps
