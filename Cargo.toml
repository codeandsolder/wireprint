[package]
name = "wireprint"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "Cross-layer HTTP edge fingerprinting and benign request-identity differential tooling"
repository = "https://github.com/codeandsolder/wireprint"

[dependencies]
anyhow = "1"
async-compression = { version = "0.4", features = ["tokio", "gzip", "brotli", "zlib"] }
bytes = "1"
http-body-util = "0.1"
hyper = { version = "=1.12.0", features = ["client", "http1", "http2"] }
hyper-rustls = { version = "=0.27.10", default-features = false, features = ["http1", "http2", "webpki-roots", "ring"] }
hyper-util = { version = "=0.1.21", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-util = { version = "0.7", features = ["io"] }
boring = "5.3"
boring-sys = "5.3"
foreign-types-shared = "0.3"
quiche = "0.30"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
hickory-resolver = { version = "0.26.3", default-features = false, features = ["system-config", "tokio"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1.52", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
url = "2.5"
wreq = { git = "https://github.com/codeandsolder/wreq-exp.git", rev = "953ea576f699c8664ecbff30805e746368c5cb5b", features = ["gzip", "brotli", "deflate", "stream", "prefix-symbols"] }
wreq-util = { version = "0.2.0", features = ["tokio-rt"] }

[dev-dependencies]
pretty_assertions = "1"

[patch.crates-io]
wreq = { git = "https://github.com/codeandsolder/wreq-exp.git", rev = "953ea576f699c8664ecbff30805e746368c5cb5b" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
rust_2024_compatibility = { level = "warn", priority = -1 }
unexpected_cfgs = "warn"
unfulfilled_lint_expectations = "deny"
unused_results = "warn"
unused_qualifications = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
await_holding_lock = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"
missing_crate_level_docs = "warn"
