[package]
name = "wireprint"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "Cross-layer HTTP edge fingerprinting and benign request-identity differential tooling"
repository = "https://github.com/codeandsolder/wireprint"

[dependencies]
anyhow = "1"
boring = "5.3"
boring-sys = "5.3"
foreign-types-shared = "0.3"
quiche = "0.30"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
hickory-resolver = { version = "0.26.3", default-features = false, features = ["system-config", "tokio"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1.52", features = ["macros", "net", "rt-multi-thread", "time"] }
url = "2.5"
wreq = { git = "https://github.com/codeandsolder/wreq-exp.git", rev = "953ea576f699c8664ecbff30805e746368c5cb5b", features = ["gzip", "brotli", "deflate", "stream", "prefix-symbols"] }
wreq-util = { version = "0.2.0", features = ["tokio-rt"] }

[dev-dependencies]
pretty_assertions = "1"

[patch.crates-io]
wreq = { git = "https://github.com/codeandsolder/wreq-exp.git", rev = "953ea576f699c8664ecbff30805e746368c5cb5b" }
