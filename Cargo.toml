[package]
name = "wireprint"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "Cross-layer HTTP edge fingerprinting and benign request-identity differential tooling"
repository = "https://github.com/codeandsolder/wireprint"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "time"] }
wreq = { version = "0.16.1", features = ["gzip", "brotli", "deflate", "stream"] }
wreq-util = { version = "0.2.0", features = ["tokio-rt"] }

[dev-dependencies]
pretty_assertions = "1"
