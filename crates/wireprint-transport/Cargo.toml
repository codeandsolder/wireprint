[package]
name = "wireprint-transport"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
description = "Shared HTTP transport profiles and request identity configuration"
repository = "https://github.com/codeandsolder/wireprint"

[features]
smithy = ["dep:aws-smithy-runtime-api", "dep:aws-smithy-types", "dep:http", "dep:tokio"]

[dependencies]
aws-smithy-runtime-api = { version = "1.22", features = ["client", "http-1x"], optional = true }
aws-smithy-types = { version = "1.9", features = ["http-body-1-x"], optional = true }
http = { version = "1", optional = true }
tokio = { version = "1", features = ["time"], optional = true }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
wreq = { git = "https://github.com/codeandsolder/wreq-exp.git", rev = "aad8f97d78e40c4c9fc0ddbb0cf88af870f848ac" }
wreq-util = { git = "https://github.com/codeandsolder/cargo-patches.git", tag = "wreq-util-v0.0.2", features = ["tokio-rt", "emulation-serde"] }

[lints]
workspace = true

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "time"] }
